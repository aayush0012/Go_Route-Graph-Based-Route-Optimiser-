version: "3.9"

services:
  db:
    image: postgres:16
    container_name: goroute_db

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: goroute_api

    depends_on:
      - db
      - redis

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    container_name: goroute_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: